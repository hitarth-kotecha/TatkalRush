# Round-robin across two app replicas (SDD §8.3).
#
# This is the entry point AC-0.7 measures through. Measuring a single replica
# directly would report a ceiling the real system never sees, since every
# request in every load profile crosses this proxy.

events {
    worker_connections 4096;
}

http {
    access_log off;                 # §15.3: logging during a run changes the run
    error_log  /dev/stderr warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    upstream tatkal_app {
        # Default round-robin, deliberately. least_conn would mask the very
        # imbalance P3 exists to create: it concentrates load on one partition
        # owner, and a clever balancer would smear that across replicas and
        # blur the strategy comparison in §9.4.
        server app-1:8080 max_fails=3 fail_timeout=5s;
        server app-2:8080 max_fails=3 fail_timeout=5s;

        keepalive 128;
    }

    server {
        listen 80;

        # nginx's own liveness, distinct from the apps'. Lets compose tell
        # "proxy is up" apart from "upstreams are up" during AC-0.1 timing.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://tatkal_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Correlation ID propagated from the edge (§15.3). The app carries
            # it in a ScopedValue and into Kafka command headers, so a booking
            # can be traced across Strategy B's request/reply hop.
            proxy_set_header X-Correlation-Id  $request_id;

            # Longer than NFR-4's 800 ms p99 spike budget, so a slow response is
            # measured rather than turned into a 504 that pollutes NFR-7's
            # error rate.
            proxy_connect_timeout 2s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }
    }
}
